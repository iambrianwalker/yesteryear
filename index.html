<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Yesteryear ATL — Independent music platform rooted in Atlanta's underground hip-hop scene.">
    <title>Yesteryear ATL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/music.css">
    <link rel="icon" type="image/x-icon" href="/assets/images/logo.PNG">
</head>
<body>
    <a class="sr-only sr-only-focusable" href="#main">Skip to content</a>

    <header>
        <div class="container">
            <h1>
                <img src="/assets/images/logo.PNG" alt="Yesteryear ATL">
            </h1>
        </div>
    </header>

    <main id="main"></main>

    <footer>
        <div class="container">
            <ul class="socials">
                <li>
                    <a aria-label="Instagram" href="https://www.instagram.com/yesteryearatl/" target="_blank" rel="noopener noreferrer">
                        <span class="fa-stack fa-2x">
                            <i class="fas fa-circle fa-stack-2x"></i>
                            <i class="fab fa-instagram fa-stack-1x fa-inverse"></i>
                        </span>
                    </a>
                </li>
                <li>
                    <a aria-label="Listen" href="https://ffm.bio/yesteryear-atl" target="_blank" rel="noopener noreferrer">
                        <span class="fa-stack fa-2x">
                            <i class="fas fa-circle fa-stack-2x"></i>
                            <i class="fas fa-music fa-stack-1x fa-inverse"></i>
                        </span>
                    </a>
                </li>
                <li>
                    <a aria-label="Email" href="mailto:contactyesteryearatl@gmail.com">
                        <span class="fa-stack fa-2x">
                            <i class="fas fa-circle fa-stack-2x"></i>
                            <i class="fas fa-envelope fa-stack-1x fa-inverse"></i>
                        </span>
                    </a>
                </li>
            </ul>
            <div class="copyright">
                <p>&copy; <span id="year"></span> Yesteryear ATL. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
