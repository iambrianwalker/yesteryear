<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Yesteryear ATL — Independent music platform rooted in Atlanta's underground hip-hop scene.">
    <title>Yesteryear ATL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/music.css">
    <link rel="icon" type="image/x-icon" href="/assets/images/logo.PNG">
</head>
<body>
    <a class="sr-only sr-only-focusable" href="#main">Skip to content</a>

    <header>
        <div class="container">
            <h1>
                <img src="/assets/images/logo.PNG" alt="Yesteryear ATL">
            </h1>
        </div>
    </header>

    <main id="main"></main>

    <footer>
        <div class="container">
            <ul class="socials">
                <li>
                    <a aria-label="Instagram" href="https://www.instagram.com/yesteryearatl/" target="_blank" rel="noopener noreferrer">
                        <span class="fa-stack fa-2x">
                            <i class="fas fa-circle fa-stack-2x"></i>
                            <i class="fab fa-instagram fa-stack-1x fa-inverse"></i>
                        </span>
                    </a>
                </li>
                <li>
                    <a aria-label="Listen" href="https://ffm.bio/yesteryear-atl" target="_blank" rel="noopener noreferrer">
                        <span class="fa-stack fa-2x">
                            <i class="fas fa-circle fa-stack-2x"></i>
                            <i class="fas fa-music fa-stack-1x fa-inverse"></i>
                        </span>
                    </a>
                </li>
                <li>
                    <a href="#" class="copy-email" role="button" aria-label="Copy email address">
                        <span class="fa-stack fa-2x">
                            <i class="fas fa-circle fa-stack-2x"></i>
                            <i class="fas fa-envelope fa-stack-1x fa-inverse copy-email-icon"></i>
                        </span>
                    </a>
                </li>
            </ul>
            <p class="copy-feedback" id="copy-feedback" role="status" aria-live="polite" hidden></p>
            <div class="copyright">
                <p>&copy; <span id="year"></span> Yesteryear ATL. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        const EMAIL = 'contactyesteryearatl@gmail.com';
        const emailBtn = document.querySelector('.copy-email');
        const emailIcon = document.querySelector('.copy-email-icon');
        const feedback = document.getElementById('copy-feedback');
        let resetTimer;

        async function copyEmail() {
            try {
                await navigator.clipboard.writeText(EMAIL);
                showFeedback('Email copied!');
            } catch {
                const textarea = document.createElement('textarea');
                textarea.value = EMAIL;
                textarea.setAttribute('readonly', '');
                textarea.style.position = 'absolute';
                textarea.style.left = '-9999px';
                document.body.appendChild(textarea);
                textarea.select();
                const copied = document.execCommand('copy');
                document.body.removeChild(textarea);

                if (copied) {
                    showFeedback('Email copied!');
                } else {
                    showFeedback('Copy failed — email is ' + EMAIL);
                }
            }
        }

        function showFeedback(message) {
            clearTimeout(resetTimer);
            feedback.hidden = false;
            feedback.textContent = message;
            emailBtn.setAttribute('aria-label', 'Email copied to clipboard');
            emailIcon.classList.remove('fa-envelope');
            emailIcon.classList.add('fa-check');

            resetTimer = setTimeout(function () {
                feedback.hidden = true;
                feedback.textContent = '';
                emailBtn.setAttribute('aria-label', 'Copy email address');
                emailIcon.classList.remove('fa-check');
                emailIcon.classList.add('fa-envelope');
            }, 2500);
        }

        emailBtn.addEventListener('click', function (event) {
            event.preventDefault();
            copyEmail();
        });

        emailBtn.addEventListener('keydown', function (event) {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                copyEmail();
            }
        });
    </script>
</body>
</html>
